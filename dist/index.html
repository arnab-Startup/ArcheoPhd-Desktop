    <script>
      (function(){
        try {
          if (window.location.pathname.endsWith('/index.html') || window.location.pathname === '/index.html' || window.location.pathname === '/' || window.location.pathname === '/login' || window.location.pathname === '/register' || window.location.pathname === '/demo') {
            try { window.history.replaceState(null, '', '/dashboard'); } catch(e){}
          }
          var projStr = localStorage.getItem('archaeophd_local_projects');
          if (projStr) {
            try {
              var projs = JSON.parse(projStr);
              if (Array.isArray(projs)) {
                var filtered = projs.filter(function(p) {
                  var t = (p.title || '') + ' ' + (p.name || '');
                  return !p.is_demo && !p.is_system_demo &&
                         t.indexOf('Southern Levant') === -1 &&
                         t.indexOf('Bengal') === -1 &&
                         t.indexOf('Demo') === -1;
                });
                if (filtered.length !== projs.length) {
                  localStorage.setItem('archaeophd_local_projects', JSON.stringify(filtered));
                  var active = localStorage.getItem('archaeo_active_project');
                  var exists = filtered.some(function(p) { return p.id === active; });
                  if (!exists) {
                    if (filtered.length > 0) {
                      localStorage.setItem('archaeo_active_project', filtered[0].id);
                    } else {
                      localStorage.removeItem('archaeo_active_project');
                    }
                  }
                }
              }
            } catch(e){}
          }
          var claimsStr = localStorage.getItem('archaeophd_local_claims');
          if (claimsStr) {
            try {
              var claims = JSON.parse(claimsStr);
              if (Array.isArray(claims)) {
                var filteredC = claims.filter(function(c) {
                  var txt = (c.claim_text || '') + ' ' + (c.text || '') + ' ' + (c.title || '');
                  return txt.indexOf('Tell es-Sultan') === -1 &&
                         txt.indexOf('1550 BCE') === -1 &&
                         txt.indexOf('Stratum IV') === -1 &&
                         txt.indexOf('Kenyon') === -1 &&
                         txt.indexOf('Southern Levant') === -1;
                });
                if (filteredC.length !== claims.length) {
                  localStorage.setItem('archaeophd_local_claims', JSON.stringify(filteredC));
                }
              }
            } catch(e){}
          }
          var sitesStr = localStorage.getItem('archaeophd_local_sites');
          if (sitesStr) {
            try {
              var sites = JSON.parse(sitesStr);
              if (Array.isArray(sites)) {
                var filteredS = sites.filter(function(s) {
                  var name = (s.site_name || '') + ' ' + (s.name || '');
                  return name.indexOf('Tell es-Sultan') === -1 &&
                         name.indexOf('Jericho') === -1 &&
                         name.indexOf('Megiddo') === -1 &&
                         name.indexOf('Hazor') === -1;
                });
                if (filteredS.length !== sites.length) {
                  localStorage.setItem('archaeophd_local_sites', JSON.stringify(filteredS));
                }
              }
            } catch(e){}
          }
          var sourcesStr = localStorage.getItem('archaeophd_local_sources');
          if (sourcesStr) {
            try {
              var sources = JSON.parse(sourcesStr);
              if (Array.isArray(sources)) {
                var filteredSrc = sources.filter(function(sc) {
                  var a = (sc.author || '') + ' ' + (sc.title || '');
                  return a.indexOf('Kenyon') === -1 &&
                         a.indexOf('Wood') === -1 &&
                         a.indexOf('Corvinus') === -1 &&
                         a.indexOf('Sankalia') === -1;
                });
                if (filteredSrc.length !== sources.length) {
                  localStorage.setItem('archaeophd_local_sources', JSON.stringify(filteredSrc));
                }
              }
            } catch(e){}
          }
        } catch(e){}
      })();
    </script>
